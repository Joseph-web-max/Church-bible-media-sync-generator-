<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Church Scripture — Projector</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
#screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4vh 6vw;text-align:center;transition:opacity .35s ease;box-sizing:border-box}
#screen.hidden{opacity:0}
#ref{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;color:#66d9b4;font-size:clamp(22px,3.4vw,56px);margin:0 0 1vh}
#ver{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#9fb0ca;font-size:clamp(13px,1.6vw,24px);letter-spacing:.08em;text-transform:uppercase;margin:0 0 4vh}
#text{white-space:pre-wrap;line-height:1.4;max-width:100%;overflow-wrap:anywhere;font-size:60px}
#multi{display:none;width:100%;max-width:1500px;gap:3vh;flex-direction:column}
.block{padding:2vh 2vw;border-top:1px solid #222}
.block:first-child{border-top:none}
.block .label{font-family:system-ui,-apple-system,sans-serif;color:#66d9b4;font-weight:700;font-size:clamp(13px,1.5vw,22px);letter-spacing:.06em;margin-bottom:1vh}
.block .body{white-space:pre-wrap;line-height:1.4;font-size:clamp(18px,2.3vw,38px);text-align:left}
#attr{position:fixed;left:0;right:0;bottom:1.5vh;text-align:center;font-family:system-ui,sans-serif;font-size:clamp(11px,1.1vw,15px);color:#6b7a90;padding:0 3vw}
#idle{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#2a3648;font-family:system-ui,sans-serif;font-size:clamp(16px,2vw,28px);text-align:center;padding:6vw}
#hint{position:fixed;top:10px;right:12px;font-family:system-ui,sans-serif;font-size:13px;color:#667;opacity:0;transition:opacity .3s;pointer-events:none}
body:hover #hint{opacity:1}
#bg{position:fixed;inset:0;z-index:0;background:#000 center/cover no-repeat;opacity:0;transition:opacity .5s ease}
#bg.on{opacity:1}
#bgDim{position:fixed;inset:0;z-index:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s ease}
#screen,#idle,#attr{z-index:2}
body.hasbg #ref,body.hasbg #text,body.hasbg .block .body,body.hasbg .block .label{text-shadow:0 2px 14px rgba(0,0,0,.9)}
body.hasbg #ver{color:#d5deee;text-shadow:0 2px 10px rgba(0,0,0,.9)}
body.hasbg .block{border-top-color:rgba(255,255,255,.25)}
body.hasbg #attr{color:#c8d2e2;text-shadow:0 1px 8px rgba(0,0,0,.9)}
body.hasbg #idle{color:rgba(255,255,255,.75);text-shadow:0 2px 10px rgba(0,0,0,.9)}
body.hasbg #connInfo{color:#d5deee!important}
</style>
</head>
<body>
<div id="bg"></div><div id="bgDim"></div>
<div id="idle"><div>
  <p>Waiting for the first verse from the control room.</p>
  <div style="margin-top:3vh">
    <input id="topicIn" placeholder="Access code or church code (for internet)" style="font:inherit;font-size:18px;padding:10px 14px;border-radius:8px;border:1px solid #334;background:#0b1220;color:#eef4ff;width:min(340px,80vw)">
    <button id="connectBtn" style="font:inherit;font-size:18px;padding:10px 16px;border-radius:8px;border:none;background:#66d9b4;color:#06251d;font-weight:700;margin-left:6px;cursor:pointer">Connect</button>
  </div>
  <p id="connInfo" style="font-size:15px;color:#667;margin-top:2vh"></p>
</div></div>

<div id="screen" class="hidden">
  <div id="ref"></div>
  <div id="ver"></div>
  <div id="text"></div>
  <div id="multi"></div>
</div>

<div id="attr"></div>
<div id="hint">Double-click or press F for full screen</div>

<script>
'use strict';
const CHANNEL = 'church-scripture-live';
const KEY = 'churchScriptureLive_v1';
const $ = id => document.getElementById(id);
let lastStamp = 0;
let fadeTimer = null;
let showing = false;

// Font size depends on how much text there is, so long passages still fit the screen
function sizeFor(len) {
  const base = Math.min(innerWidth * 0.055, innerHeight * 0.095);
  const k = len < 150 ? 1 : len < 300 ? 0.8 : len < 500 ? 0.62 : len < 800 ? 0.5 : 0.42;
  return Math.max(16, base * k) + 'px';
}

function showScreen(){ $('idle').style.display = 'none'; $('screen').classList.remove('hidden'); }

function renderSingle(p) {
  $('multi').style.display = 'none';
  $('text').style.display = 'block';
  $('ref').textContent = p.reference || '';
  $('ver').textContent = p.version ? String(p.version).toUpperCase() : '';
  const text = p.text || '';
  $('text').textContent = text;
  $('text').style.fontSize = sizeFor(text.length);
  $('attr').textContent = p.attribution || '';
}

function renderCompare(p) {
  $('text').style.display = 'none';
  $('ver').textContent = '';
  $('ref').textContent = p.reference || '';
  const list = p.translations || [];
  const total = list.reduce((n, t) => n + String(t.text || '').length, 0);
  const multi = $('multi');
  multi.innerHTML = '';
  multi.style.display = 'flex';
  const size = sizeFor(total / Math.max(1, list.length) * 1.6);
  for (const t of list) {
    const block = document.createElement('div');
    block.className = 'block';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = String(t.version || '').toUpperCase();
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = t.text || '';
    body.style.fontSize = Math.max(14, parseFloat(size) * 0.6) + 'px';
    block.append(label, body);
    multi.appendChild(block);
  }
  $('attr').textContent = '';
}

function show(payload) {
  showing = true;
  showScreen();
  if (payload.mode === 'compare' && Array.isArray(payload.translations)) renderCompare(payload);
  else renderSingle(payload);
}

// Fades out the current passage, then shows the new one
function fadeTo(fn) {
  $('screen').classList.add('hidden');
  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(fn, 350);
}

function handle(msg) {
  if (!msg || !msg.type) return;
  if (String(msg.type).startsWith('bg')) { handleBg(msg); return; }
  // The same message can arrive by BroadcastChannel and storage; only act on each one once
  if (msg.time) {
    if (msg.time <= lastStamp) return;
    lastStamp = msg.time;
  }
  if (msg.type === 'blank') {
    showing = false;
    clearTimeout(fadeTimer);
    $('screen').classList.add('hidden');
    $('idle').style.display = 'none';
    $('attr').textContent = '';
    return;
  }
  if (msg.type === 'display' && msg.payload) {
    const p = msg.payload;
    if (showing) fadeTo(() => show(p));
    else show(p);
  }
}

// ===== Background picture chosen in the control room =====
const BG_KEY = 'churchScriptureBg_v1';
let curBgId = '';
const bgParts = {};
function setDim(d) {
  d = Math.max(0, Math.min(0.9, Number(d) || 0));
  $('bgDim').style.opacity = d;
}
function applyBg(b, persist) {
  if (!b || !b.image) { clearBg(); return; }
  curBgId = b.id || '';
  $('bg').style.backgroundImage = 'url("' + b.image + '")';
  $('bg').classList.add('on');
  document.body.classList.add('hasbg');
  setDim(b.dim);
  if (persist) { try { localStorage.setItem(BG_KEY, JSON.stringify({ id: b.id, image: b.image, dim: b.dim })); } catch (e) {} }
}
function clearBg() {
  curBgId = '';
  $('bg').classList.remove('on');
  document.body.classList.remove('hasbg');
  setDim(0);
  setTimeout(() => { if (!curBgId) $('bg').style.backgroundImage = ''; }, 600);
}
function persistDim(d) {
  try {
    const o = JSON.parse(localStorage.getItem(BG_KEY) || 'null');
    if (o && o.id === curBgId) { o.dim = d; localStorage.setItem(BG_KEY, JSON.stringify(o)); }
  } catch (e) {}
}
function handleBg(msg) {
  if (msg.type === 'bg') {
    if (msg.id && msg.id === curBgId) { if (msg.dim != null) setDim(msg.dim); return; }
    applyBg(msg, false);
  } else if (msg.type === 'bgstyle') {
    setDim(msg.dim); persistDim(msg.dim);
  } else if (msg.type === 'bgclear') {
    clearBg(); try { localStorage.removeItem(BG_KEY); } catch (e) {}
  } else if (msg.type === 'bgchunk') {
    // A picture arriving from another device in small pieces (they can arrive in any order)
    if (!msg.id || msg.id === curBgId) return;
    let p = bgParts[msg.id];
    if (!p) { for (const k in bgParts) delete bgParts[k]; p = bgParts[msg.id] = { n: msg.n, parts: [], got: 0, dim: msg.dim }; }
    if (p.parts[msg.i] === undefined) { p.parts[msg.i] = msg.data; p.got++; }
    if (msg.dim != null) p.dim = msg.dim;
    if (p.got === p.n) {
      const image = p.parts.join('');
      delete bgParts[msg.id];
      applyBg({ id: msg.id, image, dim: p.dim }, true);
    }
  }
}
try { const sb = localStorage.getItem(BG_KEY); if (sb) applyBg(JSON.parse(sb), false); } catch (e) { /* storage unavailable */ }

// Receives messages from index.html (same browser, different window or tab)
let channel = null;
try {
  channel = new BroadcastChannel(CHANNEL);
  channel.onmessage = e => handle(e.data);
} catch (e) { /* BroadcastChannel not supported; storage events still work */ }

window.addEventListener('storage', e => {
  if (e.key === BG_KEY) {
    if (!e.newValue) { clearBg(); return; }
    try { handleBg({ type: 'bg', ...JSON.parse(e.newValue) }); } catch (err) { /* ignore */ }
    return;
  }
  if (e.key !== KEY || !e.newValue) return;
  try { handle(JSON.parse(e.newValue)); } catch (err) { /* ignore malformed message */ }
});

// Show whatever was sent last, if the page was opened after the control room sent it
try {
  const saved = localStorage.getItem(KEY);
  if (saved) handle(JSON.parse(saved));
} catch (e) { /* storage unavailable */ }

// Internet: listens to the church code's topic on ntfy.sh (no account needed)
// Same security scheme as the control room: the access code becomes the key and the channel name
const CS = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  async function pbkdf2(secret, saltBytes) {
    const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: saltBytes, iterations: 200000 }, base, 256));
  }
  async function sha256hex(text) {
    const d = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(text)));
    return [...d].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function deriveSession(code) {
    const c = normCode(code);
    const key = await crypto.subtle.importKey('raw', await pbkdf2(c, enc.encode('church-scripture/v2/key')), 'AES-GCM', false, ['decrypt']);
    const topic = 'cs2-' + (await sha256hex('church-scripture/v2/topic|' + c)).slice(0, 40);
    return { key, topic };
  }
  async function open(key, text) {
    const env = JSON.parse(text);
    if (!env || env.v !== 2) throw new Error('unsupported message');
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct));
    return JSON.parse(dec.decode(pt));
  }
  return { normCode, deriveSession, open };
})();

let es = null, sess = null;
function setConnInfo(t) { $('connInfo').textContent = t; }
async function connectInternet(input) {
  if (es) es.close();
  sess = null;
  if (!input) return;
  let topic = input;
  if (CS.normCode(input).length === 16 && /^[A-Za-z0-9\s-]+$/.test(input)) {
    // An access code from the control room: derive the secret channel and the decryption key
    setConnInfo('Checking access code…');
    try { sess = await CS.deriveSession(input); topic = sess.topic; $('topicIn').value = ''; }
    catch (e) { setConnInfo('Access codes need this page to be opened through https or http://localhost.'); return; }
  } else {
    try { localStorage.setItem('csTopic', input); } catch (e) {}
    $('topicIn').value = input;
  }
  es = new EventSource('https://ntfy.sh/' + encodeURIComponent(topic) + '/sse?since=2m');
  es.onopen = () => setConnInfo('Connected to the internet code. Waiting for verses.');
  es.onmessage = async e => {
    try {
      const d = JSON.parse(e.data);
      if (d.event !== 'message' || !d.message) return;
      let obj = JSON.parse(d.message);
      if (obj && obj.v === 2) { if (!sess) return; obj = await CS.open(sess.key, d.message); }
      handle(obj);
    } catch (err) { /* ignore messages that are not verses */ }
  };
  es.onerror = () => setConnInfo('Internet connection lost. Retrying…');
}
$('connectBtn').onclick = () => connectInternet($('topicIn').value.trim());

// Same room: asks the local relay (relay.py) for the latest verse every 0.7 seconds
let relaySeq = 0;
async function pollRelay() {
  try {
    const r = await fetch('/api/latest', { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.seq > relaySeq) {
      relaySeq = d.seq;
      if (d.msg) handle(d.msg);
    }
  } catch (e) { /* relay not running */ }
}

const params = new URLSearchParams(location.search);
const savedTopic = params.get('ntfy') || localStorage.getItem('csTopic') || '';
if (savedTopic) connectInternet(savedTopic);
if (location.protocol.startsWith('http')) { pollRelay(); setInterval(pollRelay, 700); }

// Full screen: double-click or press F
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
document.addEventListener('dblclick', toggleFullscreen);
document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); });
addEventListener('resize', () => {
  const t = $('text');
  if (t.style.display !== 'none' && t.textContent) t.style.fontSize = sizeFor(t.textContent.length);
});
</script>
</body>
</html>
