<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#050a14" id="metaTheme"><script>(function(){var r=document.documentElement;try{var p=localStorage.getItem('cs_theme');if(p!=='light'&&p!=='dark')p='system';var d=p==='dark'||(p==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',d?'dark':'light');r.setAttribute('data-pref',p);}catch(e){r.setAttribute('data-theme','dark');}})();</script>
<title>Church Scripture — Projector</title>
<style>
:root,:root[data-theme=dark]{color-scheme:dark;--bg:#050a14;--glow1:rgba(45,212,191,.10);--glow2:rgba(59,110,200,.13);--text:#f4f8ff;--accent:#5eead4;--muted:#9fb0ca;--faint:#7a89a3;--idle:#4a5c7a;--line:#243656;--field:#0a1527;--btn:#3dd6c0;--btn-ink:#04231d}
:root[data-theme=light]{color-scheme:light;--bg:#faf6ef;--glow1:rgba(20,150,136,.10);--glow2:rgba(235,190,120,.22);--text:#1c2431;--accent:#0a6b63;--muted:#566176;--faint:#6b7488;--idle:#6b7488;--line:#d9cfbc;--field:#fffdf8;--btn:#0b7f75;--btn-ink:#fff}
html,body{margin:0;height:100%;background:transparent;color:var(--text);overflow:hidden;font-family:Georgia,"Times New Roman",serif}
html{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 6% -10%,var(--glow1),transparent 62%),radial-gradient(820px 560px at 100% 0,var(--glow2),transparent 58%)}
#screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4vh 6vw;text-align:center;transition:opacity .35s ease;box-sizing:border-box}
#screen.hidden{opacity:0;pointer-events:none}
#ref{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;color:var(--accent);font-size:clamp(22px,3.4vw,56px);margin:0 0 1vh}
#ver{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--muted);font-size:clamp(13px,1.6vw,24px);letter-spacing:.08em;text-transform:uppercase;margin:0 0 4vh}
#text{unicode-bidi:plaintext;white-space:pre-wrap;line-height:1.4;max-width:100%;overflow-wrap:anywhere;font-size:60px}
#multi{display:none;width:100%;max-width:1500px;gap:3vh;flex-direction:column}
.block{padding:2vh 2vw;border-top:1px solid var(--line)}
.block:first-child{border-top:none}
.block .label{font-family:system-ui,-apple-system,sans-serif;color:var(--accent);font-weight:700;font-size:clamp(13px,1.5vw,22px);letter-spacing:.06em;margin-bottom:1vh}
.block .body{white-space:pre-wrap;line-height:1.4;font-size:clamp(18px,2.3vw,38px);text-align:left}
#attr{position:fixed;left:0;right:0;bottom:1.5vh;text-align:center;font-family:system-ui,sans-serif;font-size:clamp(11px,1.1vw,15px);color:var(--faint);padding:0 3vw}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:no-repeat;background-position:center;background-color:#000;display:none}
#bg::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--bgdim,.45)}
:root.hasbg[data-theme]{--text:#fff;--accent:#7ff0df;--muted:#dbe6f5;--faint:#cfd9ea;--idle:#dbe6f5;--line:rgba(255,255,255,.28)}
:root.hasbg #screen,:root.hasbg #idle,:root.hasbg #attr{text-shadow:0 2px 10px rgba(0,0,0,.75)}
#idle{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;color:var(--idle);font-family:system-ui,sans-serif;font-size:clamp(16px,2vw,28px);text-align:center;padding:6vw}
#hint{position:fixed;top:10px;right:12px;font-family:system-ui,sans-serif;font-size:13px;color:var(--faint);opacity:0;transition:opacity .3s;pointer-events:none}
#themeBtn{position:fixed;top:8px;left:10px;z-index:20;font:600 13px system-ui,sans-serif;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--text);cursor:pointer;opacity:0;transition:opacity .3s}
body:hover #hint,body:hover #themeBtn,#themeBtn:focus-visible{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="bg"></div>
<div id="idle"><div>
  <p>Waiting for the first verse from the control room.</p>
  <div style="margin-top:3vh">
    <input id="topicIn" type="password" autocomplete="off" spellcheck="false" placeholder="Access code" style="font:inherit;font-size:18px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--text);width:min(340px,80vw);text-transform:uppercase">
    <button id="connectBtn" style="font:inherit;font-size:18px;padding:10px 16px;border-radius:8px;border:none;background:var(--btn);color:var(--btn-ink);font-weight:700;margin-left:6px;cursor:pointer">Connect</button>
  </div>
  <p id="connInfo" style="font-size:15px;color:var(--faint);margin-top:2vh"></p>
  <p style="margin-top:2vh"><button id="forgetBtn" style="font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer">Forget access code on this screen</button></p>
</div></div>

<div id="screen" class="hidden">
  <div id="ref"></div>
  <div id="ver"></div>
  <div id="text"></div>
  <div id="multi"></div>
</div>

<video id="vid" playsinline style="display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:10"></video>
<video id="live" autoplay playsinline style="display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:10"></video>
<div id="vidNote" style="display:none;position:fixed;left:0;right:0;bottom:2vh;text-align:center;z-index:11;font-family:system-ui,sans-serif;font-size:14px;color:#9fb0ca"></div>
<div id="attr"></div>
<button id="themeBtn" type="button">Theme</button>
<div id="hint">Double-click or press F for full screen</div>

<script>
'use strict';
/* Shared security helpers. Codes never travel in plain text:
   - the access code becomes an AES-256-GCM key (PBKDF2, 200,000 rounds)
   - the internet channel name is a hash of the code, so it cannot be guessed
   - every verse is encrypted and authenticated, so forged messages are rejected */
const CS = (() => {
  const ITER = 200000;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = u8 => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
  async function pbkdf2(secret, saltBytes) {
    const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: saltBytes, iterations: ITER }, base, 256));
  }
  async function hashSecret(secret, saltB64) { return b64(await pbkdf2(secret, unb64(saltB64))); }
  async function checkSecret(secret, saltB64, hashB64) {
    const got = await hashSecret(secret, saltB64);
    let diff = got.length ^ hashB64.length;
    for (let i = 0; i < got.length && i < hashB64.length; i++) diff |= got.charCodeAt(i) ^ hashB64.charCodeAt(i);
    return diff === 0;
  }
  async function sha256hex(text) {
    const d = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(text)));
    return [...d].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function deriveSession(code) {
    const c = normCode(code);
    const key = await crypto.subtle.importKey('raw', await pbkdf2(c, enc.encode('church-scripture/v2/key')), 'AES-GCM', false, ['encrypt', 'decrypt']);
    const topic = 'cs2-' + (await sha256hex('church-scripture/v2/topic|' + c)).slice(0, 40);
    return { key, topic };
  }
  async function seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj))));
    return JSON.stringify({ v: 2, iv: b64(iv), ct: b64(ct) });
  }
  async function open(key, text) {
    const env = JSON.parse(text);
    if (!env || env.v !== 2) throw new Error('unsupported message');
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct));
    return JSON.parse(dec.decode(pt));
  }
  function lockInfo() { try { return JSON.parse(localStorage.getItem('cs_lock') || '{"n":0,"until":0}'); } catch (e) { return { n: 0, until: 0 }; } }
  function noteFail() { const l = lockInfo(); l.n = (l.n || 0) + 1; if (l.n >= 5) { l.until = Date.now() + 5 * 60 * 1000; l.n = 0; } try { localStorage.setItem('cs_lock', JSON.stringify(l)); } catch (e) {} }
  function clearFails() { try { localStorage.removeItem('cs_lock'); } catch (e) {} }
  return { normCode, newSalt, hashSecret, checkSecret, deriveSession, seal, open, lockInfo, noteFail, clearFails };
})();


const CHANNEL = 'church-scripture-live';
const KEY = 'churchScriptureLive_v1';
const $ = id => document.getElementById(id);
let lastStamp = 0;
let fadeTimer = null;
let showing = false;

// Font size depends on how much text there is, so long passages still fit the screen
function sizeFor(len) {
  const base = Math.min(innerWidth * 0.055, innerHeight * 0.095);
  const k = len < 150 ? 1 : len < 300 ? 0.8 : len < 500 ? 0.62 : len < 800 ? 0.5 : 0.42;
  return Math.max(16, base * k) + 'px';
}

function showScreen() { $('idle').style.display = 'none'; $('screen').classList.remove('hidden'); }

function renderSingle(p) {
  $('multi').style.display = 'none';
  $('text').style.display = 'block';
  $('ref').textContent = p.reference || '';
  $('ver').textContent = p.version ? String(p.version).toUpperCase() : '';
  const text = p.text || '';
  $('text').textContent = text;
  $('text').style.fontSize = sizeFor(text.length);
  $('attr').textContent = p.attribution || '';
}

function renderCompare(p) {
  $('text').style.display = 'none';
  $('ver').textContent = '';
  $('ref').textContent = p.reference || '';
  const list = p.translations || [];
  const total = list.reduce((n, t) => n + String(t.text || '').length, 0);
  const multi = $('multi');
  multi.innerHTML = '';
  multi.style.display = 'flex';
  const size = sizeFor(total / Math.max(1, list.length) * 1.6);
  for (const t of list) {
    const block = document.createElement('div');
    block.className = 'block';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = String(t.version || '').toUpperCase();
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = t.text || '';
    body.style.fontSize = Math.max(14, parseFloat(size) * 0.6) + 'px';
    block.append(label, body);
    multi.appendChild(block);
  }
  $('attr').textContent = '';
}

function show(payload) {
  showing = true;
  showScreen();
  if (payload.mode === 'compare' && Array.isArray(payload.translations)) renderCompare(payload);
  else renderSingle(payload);
}

// Fades out the current passage, then shows the new one
function fadeTo(fn) {
  $('screen').classList.add('hidden');
  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(fn, 350);
}


/* ===== Video playback: files come from this device's storage (added in index.html) ===== */
const vid = $('vid');
let vidUrl = null;
function openVideoDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('churchScriptureVideos_v1', 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('videos')) r.result.createObjectStore('videos', { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function getVideo(id) {
  const d = await openVideoDB();
  return new Promise((res, rej) => {
    const q = d.transaction('videos').objectStore('videos').get(id);
    q.onsuccess = () => { d.close(); res(q.result); };
    q.onerror = () => { d.close(); rej(q.error); };
  });
}
function stopVideo() {
  vid.pause(); vid.removeAttribute('src'); vid.load();
  vid.style.display = 'none';
  $('vidNote').style.display = 'none';
  if (vidUrl) { URL.revokeObjectURL(vidUrl); vidUrl = null; }
}
function vidNote(t) {
  const n = $('vidNote'); n.textContent = t; n.style.display = 'block';
  setTimeout(() => { n.style.display = 'none'; }, 7000);
}
async function playVideo(p) {
  let rec;
  try { rec = await getVideo(p.id); } catch (e) { rec = null; }
  if (!rec || !rec.blob) { vidNote('Video not found on this device. Add it in the control room first.'); return; }
  showing = false;
  clearTimeout(fadeTimer);
  $('screen').classList.add('hidden');
  $('idle').style.display = 'none';
  $('attr').textContent = '';
  const old = vidUrl;
  vidUrl = URL.createObjectURL(rec.blob);
  vid.src = vidUrl;
  if (old) URL.revokeObjectURL(old);
  vid.loop = !!p.loop;
  vid.muted = !!p.muted;
  vid.style.display = 'block';
  try { await vid.play(); }
  catch (e) {
    // Browsers may block sound until someone clicks the page once: start muted instead
    vid.muted = true;
    try { await vid.play(); vidNote('Playing without sound. Click once on this screen to turn sound on.'); } catch (e2) {}
  }
}
vid.addEventListener('click', () => { if (vid.muted && vid.style.display !== 'none') vid.muted = false; });
vid.addEventListener('ended', () => { if (!vid.loop) stopVideo(); });
function handleVideo(p) {
  if (p.action === 'play') { stopLive(); playVideo(p); }
  else if (p.action === 'pause') vid.pause();
  else if (p.action === 'resume') { if (vid.src) vid.play().catch(() => {}); }
  else if (p.action === 'stop') { stopVideo(); showing = false; $('idle').style.display = 'none'; $('screen').classList.add('hidden'); }
}


/* ===== Live camera from the control room (same browser), received over WebRTC ===== */
const live = $('live');
let lpc = null, lsid = null, lchain = Promise.resolve(), rtc = null;
try { rtc = new BroadcastChannel('church-scripture-rtc'); } catch (e) {}
function stopLive() {
  if (lsid && rtc) rtc.postMessage({ t: 'bye', sid: lsid });
  if (lpc) { lpc.close(); lpc = null; }
  lsid = null; live.srcObject = null; live.style.display = 'none';
}
function startLive() {
  stopLive(); stopVideo();
  if (!rtc || !window.RTCPeerConnection) { vidNote('Live camera is not supported in this browser.'); return; }
  showing = false; clearTimeout(fadeTimer);
  $('screen').classList.add('hidden'); $('idle').style.display = 'none'; $('attr').textContent = '';
  const sid = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
  const pc = new RTCPeerConnection({ iceServers: [] });
  lpc = pc; lsid = sid;
  pc.ontrack = e => {
    live.srcObject = e.streams[0]; live.muted = false; live.style.display = 'block';
    live.play().catch(() => { live.muted = true; live.play().catch(() => {}); vidNote('Playing without sound. Click once on this screen to turn sound on.'); });
  };
  pc.onicecandidate = e => { if (e.candidate) rtc.postMessage({ t: 'ice', sid, from: 'p', cand: e.candidate.toJSON() }); };
  rtc.postMessage({ t: 'req', sid });
  setTimeout(() => { if (lsid === sid && live.style.display === 'none') vidNote('No camera picture yet. Start the camera in the control room first.'); }, 6000);
}
live.addEventListener('click', () => { if (live.muted) live.muted = false; });
if (rtc) rtc.onmessage = e => {
  const m = e.data;
  if (!m || !lpc || m.sid !== lsid) return;
  const pc = lpc;
  lchain = lchain.then(async () => {
    if (m.t === 'offer') {
      await pc.setRemoteDescription(m.sdp);
      const a = await pc.createAnswer(); await pc.setLocalDescription(a);
      rtc.postMessage({ t: 'answer', sid: m.sid, sdp: { type: a.type, sdp: a.sdp } });
    } else if (m.t === 'ice' && m.from === 's') await pc.addIceCandidate(m.cand);
  }).catch(() => {});
};
function handleCamera(p) {
  if (p.action === 'start') startLive();
  else if (p.action === 'stop') { stopLive(); showing = false; $('idle').style.display = 'none'; $('screen').classList.add('hidden'); }
}

function handle(msg) {
  if (!msg || !msg.type) return;
  if (msg.type === 'background') { applyBackground(msg); return; }
  // The same message can arrive by BroadcastChannel and storage; only act on each one once
  if (msg.time) {
    if (msg.time <= lastStamp) return;
    lastStamp = msg.time;
  }
  if (msg.type === 'video' && msg.payload) { handleVideo(msg.payload); return; }
  if (msg.type === 'camera' && msg.payload) { handleCamera(msg.payload); return; }
  if (msg.type === 'blank') {
    stopVideo(); stopLive();
    showing = false;
    clearTimeout(fadeTimer);
    $('screen').classList.add('hidden');
    $('idle').style.display = 'none';
    $('attr').textContent = '';
    return;
  }
  if (msg.type === 'display' && msg.payload) {
    stopVideo(); stopLive();
    const p = msg.payload;
    if (showing) fadeTo(() => show(p));
    else show(p);
  }
}


/* ===== Background picture chosen in the control room (saved on this device) ===== */
let bgRev = 0;
function openBgDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('churchScriptureBackground_v1', 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('bg')) r.result.createObjectStore('bg', { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function getBg() {
  const d = await openBgDB();
  return new Promise((res, rej) => {
    const q = d.transaction('bg').objectStore('bg').get('current');
    q.onsuccess = () => { d.close(); res(q.result); };
    q.onerror = () => { d.close(); rej(q.error); };
  });
}
function bgCfgApply(c) {
  const el = $('bg');
  const dim = c && typeof c.dim === 'number' ? Math.max(0, Math.min(85, c.dim)) : 45;
  el.style.setProperty('--bgdim', String(dim / 100));
  el.style.backgroundSize = c && c.fit === 'contain' ? 'contain' : 'cover';
}
async function applyBackground(m) {
  if (m && m.rev) { if (m.rev <= bgRev) return; bgRev = m.rev; }
  const el = $('bg');
  if (m && m.action === 'clear') { el.style.display = 'none'; el.style.backgroundImage = 'none'; document.documentElement.classList.remove('hasbg'); return; }
  bgCfgApply(m && m.cfg);
  if (m && m.action === 'cfg' && el.style.display === 'block') return;
  try {
    const r = await getBg();
    if (!r || !r.data) { el.style.display = 'none'; document.documentElement.classList.remove('hasbg'); return; }
    el.style.backgroundImage = 'url("' + r.data + '")';
    el.style.display = 'block';
    document.documentElement.classList.add('hasbg');
  } catch (e) { /* storage unavailable */ }
}
// Show the saved background as soon as the projector opens
try {
  let c = null; try { c = JSON.parse(localStorage.getItem('cs_bg_cfg') || 'null'); } catch (e) {}
  applyBackground({ action: 'set', cfg: c });
} catch (e) {}

// Receives messages from index.html (same browser, different window or tab)
let channel = null;
try {
  channel = new BroadcastChannel(CHANNEL);
  channel.onmessage = e => { if (e.data && e.data.type === 'ping') { try { channel.postMessage({ type: 'pong' }); } catch (err) {} return; } handle(e.data); };
} catch (e) { /* BroadcastChannel not supported; storage events still work */ }

window.addEventListener('storage', e => {
  if (e.key === 'cs_bg_rev' && e.newValue) { try { applyBackground(JSON.parse(e.newValue)); } catch (err) {} return; }
  if (e.key !== KEY || !e.newValue) return;
  try { handle(JSON.parse(e.newValue)); } catch (err) { /* ignore malformed message */ }
});

// Show whatever was sent last, if the page was opened after the control room sent it
try {
  const saved = localStorage.getItem(KEY);
  if (saved) { const m = JSON.parse(saved); if (m.type !== 'video' && m.type !== 'camera') handle(m); }
} catch (e) { /* storage unavailable */ }

/* ===== Internet: verses arrive encrypted with the access code ===== */
let es = null;
function setConnInfo(t) { $('connInfo').textContent = t; }

async function connectInternet(code) {
  if (es) { es.close(); es = null; }
  const c = CS.normCode(code);
  if (!c) { setConnInfo('Enter the access code.'); return; }
  setConnInfo('Starting secure connection…');
  let s;
  try { s = await CS.deriveSession(c); }
  catch (e) { setConnInfo('This browser cannot run secure encryption. Use a current Chrome, Edge, Firefox or Safari.'); return; }
  try { sessionStorage.setItem('csAccess', c); } catch (e) {}
  $('topicIn').value = '';
  es = new EventSource('https://ntfy.sh/' + s.topic + '/sse?since=2m');
  es.onopen = () => setConnInfo('Connected with access code. Waiting for verses. If nothing appears, check the code.');
  es.onmessage = async e => {
    try {
      const d = JSON.parse(e.data);
      if (d.event === 'message' && d.message) handle(await CS.open(s.key, d.message));
    } catch (err) { /* not a verse for this code: ignore */ }
  };
  es.onerror = () => setConnInfo('Internet connection lost. Retrying…');
}
$('connectBtn').onclick = () => connectInternet($('topicIn').value);
$('topicIn').addEventListener('keydown', e => { if (e.key === 'Enter') connectInternet($('topicIn').value); });
$('forgetBtn').onclick = () => {
  try { sessionStorage.removeItem('csAccess'); } catch (e) {}
  if (es) { es.close(); es = null; }
  $('topicIn').value = '';
  setConnInfo('Access code forgotten on this screen.');
};

// Same room: asks the local relay (relay.py) for the latest verse every 0.7 seconds
let relaySeq = 0;
async function pollRelay() {
  try {
    const r = await fetch('/api/latest', { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.seq > relaySeq) {
      relaySeq = d.seq;
      if (d.msg) handle(d.msg);
    }
  } catch (e) { /* relay not running */ }
}
if (location.protocol.startsWith('http')) { pollRelay(); setInterval(pollRelay, 700); }

// Reconnect automatically if this tab already has an access code
let savedCode = '';
try { savedCode = sessionStorage.getItem('csAccess') || ''; } catch (e) {}
if (savedCode) connectInternet(savedCode);

// Full screen: double-click or press F
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
document.addEventListener('dblclick', e => { if (e.target.closest('input,button')) return; toggleFullscreen(); });
document.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input')) return; if (e.key === 'f' || e.key === 'F') toggleFullscreen(); });
addEventListener('resize', () => {
  const t = $('text');
  if (t.style.display !== 'none' && t.textContent) t.style.fontSize = sizeFor(t.textContent.length);
});

/* ===== Theme: follows the control room (shared 'cs_theme'); button cycles System / Light / Night ===== */
(function () {
  const TK = 'cs_theme', root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
  const NAMES = { system: 'System', light: 'Light', dark: 'Night' }, ORDER = ['system', 'light', 'dark'];
  const getPref = () => { try { const p = localStorage.getItem(TK); return p === 'light' || p === 'dark' ? p : 'system'; } catch (e) { return 'system'; } };
  function apply(p) {
    const dark = p === 'dark' || (p === 'system' && mq.matches);
    root.setAttribute('data-theme', dark ? 'dark' : 'light'); root.setAttribute('data-pref', p);
    const m = $('metaTheme'); if (m) m.setAttribute('content', dark ? '#050a14' : '#faf6ef');
    $('themeBtn').textContent = (dark ? '🌙 ' : '☀️ ') + NAMES[p];
    $('themeBtn').title = 'Theme: ' + NAMES[p] + ' (click to change)';
  }
  $('themeBtn').onclick = () => { const n = ORDER[(ORDER.indexOf(getPref()) + 1) % 3]; try { localStorage.setItem(TK, n); } catch (e) {} apply(n); };
  const onSys = () => { if (getPref() === 'system') apply('system'); };
  if (mq.addEventListener) mq.addEventListener('change', onSys); else if (mq.addListener) mq.addListener(onSys);
  addEventListener('storage', e => { if (e.key === TK || e.key === null) apply(getPref()); });
  apply(getPref());
})();
</script>
</body>
</html>
